<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#166534" />
  <title>SEA - IFAL</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --sea-green: #166534;
      --sea-green-hover: #15803d;
      --sea-bg: #f3f4f6;
    }

    body {
      margin: 0;
      color: #1f2937;
      background:
        radial-gradient(circle at 10% 0%, rgba(22, 101, 52, .06), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(22, 101, 52, .045), transparent 25%),
        var(--sea-bg);
      background-attachment: fixed;
    }

    a,
    button {
      transition: background-color .18s ease, color .18s ease;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--sea-green);
      outline-offset: 2px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 1rem;
      box-shadow: 0 20px 55px rgba(17, 24, 39, .10);
      padding: 2rem;
      overflow-wrap: anywhere;
    }

    .label {
      display: block;
      margin-bottom: .25rem;
      font-size: .875rem;
      font-weight: 500;
      color: #374151;
    }

    /* 16px evita o zoom automático do iOS ao focar no campo */
    .field {
      min-height: 44px;
      padding: .6rem .9rem;
      border: 1px solid #d1d5db;
      border-radius: .75rem;
      background: #fff;
      font-size: 1rem;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .field:focus {
      outline: none;
      border-color: var(--sea-green);
      box-shadow: 0 0 0 3px rgba(22, 101, 52, .18);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: .6rem 1.25rem;
      border-radius: .75rem;
      font-weight: 600;
      color: #fff;
      background: var(--sea-green);
      cursor: pointer;
    }

    .btn:hover {
      background: var(--sea-green-hover);
    }

    .link {
      color: var(--sea-green);
      font-weight: 600;
    }

    .link:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .card {
        padding: 1.35rem;
      }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">
  <!-- Navbar -->
  <header class="sticky top-0 z-50 w-full bg-green-800 text-white p-4 shadow-lg">
    <div class="max-w-6xl mx-auto">
      <h1 class="font-bold text-lg">SEA - IFAL</h1>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-8">
    {% if modo == "login"%}
    <section class="card w-full max-w-sm">
      <!-- Título -->
      <h2 class="text-2xl font-bold text-gray-900 text-center mb-6">
        Acessar Conta
      </h2>

      <form action="/login" method="post" class="space-y-4">
        <!-- Username -->
        <div>
          <label for="username" class="label">Usuário</label>
          <input type="text" id="username" name="username" autocomplete="username" required class="field w-full" />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="label">Senha</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required
            class="field w-full" />
        </div>

        <!-- Botão -->
        <button type="submit" class="btn w-full">Entrar</button>
      </form>

      <p class="text-sm text-gray-500 text-center mt-6">
        Não tem conta?
        <a href="/cadastro" class="link">Cadastrar</a>
      </p>
    </section>

    {% elif modo == "cadastro" %}
    <section class="card w-full max-w-sm">
      <!-- Título -->
      <h2 class="text-2xl font-bold text-gray-900 text-center mb-6">
        Criar Conta
      </h2>

      <form action="/register" method="post" class="space-y-4">
        <!-- Nome -->
        <div>
          <label for="name" class="label">Nome Completo</label>
          <input type="text" id="name" name="name" autocomplete="name" required class="field w-full" />
        </div>

        <!-- Usuário -->
        <div>
          <label for="username" class="label">Usuário</label>
          <input type="text" id="username" name="username" autocomplete="username" required class="field w-full" />
        </div>

        <!-- Curso-->
        <div>
          <label for="curso" class="label">Curso</label>
          <select name="curso" id="curso" required class="field w-full">
            <option value="">Selecione o curso</option>
            <option value="Professor">Professor</option>
            <option value="Desenvolvimento de Sistema">
              Desenvolvimento de Sistema
            </option>
            <option value="Meio Ambiente">Meio Ambiente</option>
            <option value="Guia de Turismo">Guia de Turismo</option>
            <option value="Instrumento Musical">Instrumento Musical</option>
            <option value="Hospedagem">Hospedagem</option>
          </select>
        </div>

        <!-- Série -->
        <div id="div_serie">
          <label for="serie" class="label">Série</label>
          <select name="serie" id="serie" required class="field w-full">
            <option value="">Selecione a série</option>
            <option value="1">1º</option>
            <option value="2">2º</option>
            <option value="3">3º</option>
          </select>
        </div>

        <!-- Turma -->
        <div id="div_turma">
          <label for="turma" class="label">Turma</label>
          <select name="turma" id="turma" required class="field w-full">
            <option value="">Selecione a turma</option>
            <option value="A">A</option>
            <option value="B">B</option>
          </select>
        </div>

        <!-- Matricula -->
        <div id="div_matricula">
          <label for="matricula" class="label">Matrícula</label>
          <input type="number" id="matricula" name="matricula" inputmode="numeric" required class="field w-full" />
        </div>

        <!-- Senha -->
        <div>
          <label for="password" class="label">Senha</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required
            class="field w-full" />
        </div>

        <!-- Rodapé -->
        <p class="text-sm text-gray-500 text-center pt-2">
          Já tem conta?
          <a href="/" class="link">Entrar</a>
        </p>

        <!-- Botão -->
        <button type="submit" class="btn w-full">Cadastrar</button>
      </form>
    </section>
    {% endif %}
  </main>

  <div id="toast-container" class="fixed top-20 left-4 right-4 sm:left-auto z-[9999] flex flex-col gap-3">
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>

  <div id="mensagens-flash"
    data-mensagens='{{ get_flashed_messages(with_categories=true) | tojson | forceescape }}'>
  </div>
  <script>
    const elemento = document.getElementById("mensagens-flash");
    const mensagensFlash = JSON.parse(elemento.dataset.mensagens);
    mensagensFlash.forEach(([categoria, mensagem]) => {
      mostrarToast(mensagem, categoria);
    });
  </script>
</body>

</html>1
